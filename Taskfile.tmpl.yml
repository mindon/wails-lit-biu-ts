version: '3'

vars:
  APP_NAME: "{{.BinaryName}}"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.Opn}}.PACKAGE_MANAGER | default "biu"{{.Cls}}'
  VITE_PORT: '{{.Opn}}.WAILS_VITE_PORT | default 9245{{.Cls}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.Opn}}.GOOS | default OS{{.Cls}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    deps:
      - task: biu:check
    cmds:
      - task: "{{.Opn}}.GOOS{{.Cls}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.Opn}}.GOOS{{.Cls}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.Opn}}.GOOS{{.Cls}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.Opn}}.VITE_PORT{{.Cls}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  biu:check:
    summary: prepare biu from https://mindon.dev/biu/
    cmds:
      - task: "{{.Opn}}if eq .GOOS \"windows\"{{.Cls}}windows:biu:check{{.Opn}}else{{.Cls}}unix:biu:check{{.Opn}}end{{.Cls}}"

  unix:biu:check:
    cmds:
      - |
        if ! command -v biu >/dev/null 2>&1; then
          curl -fsSL https://mindon.dev/biu/install | bash
        fi

        python - <<'PY'
        from pathlib import Path
        target = Path("build/Taskfile.yml")
        source = Path("build/biu.tasks")
        text = target.read_text(encoding="utf-8")
        block = source.read_text(encoding="utf-8")
        if "tasks:" in text and "install:frontend:deps:biu:" not in text:
            insert_at = text.index("tasks:")
            text = text[:insert_at + len("tasks:")] + "\n" + block + "\n" + text[insert_at + len("tasks:"):]
            target.write_text(text, encoding="utf-8")
        PY
        biu --version

  windows:biu:check:
    cmds:
      - |
        where biu >nul 2>nul
        if errorlevel 1 (
          powershell -c "irm https://mindon.dev/biu/install.ps1 | iex"
        )

        $target = "build/Taskfile.yml"
        $source = "build/biu.tasks"

        $text = Get-Content $target -Raw
        $block = Get-Content $source -Raw

        if ($text.Contains("tasks:") -and -not $text.Contains("install:frontend:deps:biu:")) {
          $idx = $text.IndexOf("tasks:")
          $text = $text.Substring(0, $idx + "tasks:".Length) + "`r`n" + $block + "`r`n" + $text.Substring($idx + "tasks:".Length)
          Set-Content $target $text
        }
        biu --version
